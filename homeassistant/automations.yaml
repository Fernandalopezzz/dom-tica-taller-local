- id: "regla_ventilador_calor"
  alias: "Ventilador por calor con puerta cerrada"
  description: "Enciende el ventilador si T > 28 C Y la puerta esta cerrada"
  mode: single
  triggers:
    - trigger: numeric_state
      entity_id: sensor.taller_temperatura
      above: 28
    - trigger: state
      entity_id: binary_sensor.taller_puerta
      to: "off"
  conditions:
    - condition: numeric_state
      entity_id: sensor.taller_temperatura
      above: 28
    - condition: state
      entity_id: binary_sensor.taller_puerta
      state: "off"
  actions:
    - action: switch.turn_on
      target:
        entity_id: switch.taller_ventilador
 
- id: "regla_ventilador_apagado"
  alias: "Apagar ventilador al normalizarse"
  description: "Apaga el ventilador si T < 26 C O se abre la puerta (histeresis)"
  mode: single
  triggers:
    - trigger: numeric_state
      entity_id: sensor.taller_temperatura
      below: 26
    - trigger: state
      entity_id: binary_sensor.taller_puerta
      to: "on"
  actions:
    - action: switch.turn_off
      target:
        entity_id: switch.taller_ventilador
 
- id: "regla_luz_entrada"
  alias: "Luz auxiliar al entrar con poca luz"
  description: "Enciende la luz si la puerta se abre Y la luminosidad es < 20 lx"
  mode: single
  triggers:
    - trigger: state
      entity_id: binary_sensor.taller_puerta
      to: "on"
  conditions:
    - condition: numeric_state
      entity_id: input_number.luz_taller
      below: 20
  actions:
    - action: switch.turn_on
      target:
        entity_id: switch.taller_luz
 
- id: "regla_luz_apagado"
  alias: "Apagar luz al cerrar la puerta"
  description: "Apaga la luz 2 minutos despues de cerrar la puerta"
  mode: restart
  triggers:
    - trigger: state
      entity_id: binary_sensor.taller_puerta
      to: "off"
      for: "00:02:00"
  actions:
    - action: switch.turn_off
      target:
        entity_id: switch.taller_luz
